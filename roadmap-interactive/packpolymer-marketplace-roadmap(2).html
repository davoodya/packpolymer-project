:root{
  --bg:#070b14;
  --bg-2:#0b1222;
  --surface:#0f172a;
  --surface-2:#131f38;
  --surface-3:#182541;
  --line:rgba(148,175,224,.14);
  --line-strong:rgba(148,175,224,.28);
  --tx:#e9eefb;
  --tx-2:#a9b8d6;
  --tx-3:#7d8db0;
  --a1:#2dd4bf;
  --a2:#6366f1;
  --a3:#f59e0b;
  --ok:#34d399;
  --warn:#fbbf24;
  --danger:#fb7185;
  --radius:16px;
  --radius-sm:11px;
  --shadow:0 18px 44px -22px rgba(0,0,0,.95);
  --ring:0 0 0 3px rgba(45,212,191,.18);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 88% -12%, rgba(99,102,241,.14), transparent 62%),
    radial-gradient(900px 520px at 6% 0%, rgba(45,212,191,.10), transparent 60%),
    linear-gradient(180deg,#070b14 0%,#080d1a 45%,#06090f 100%);
  background-attachment:fixed;
  color:var(--tx);
  font-family:'Vazir','Vazirmatn','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',Tahoma,system-ui,sans-serif;
  font-size:15px;
  line-height:1.95;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(148,175,224,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,175,224,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 78%);
}
a{color:var(--a1);text-decoration:none}
::selection{background:rgba(45,212,191,.28)}

/* ---------- scrollbar ---------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(148,175,224,.20);border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(148,175,224,.36);background-clip:content-box}

/* ---------- shell ---------- */
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:20px 22px 60px;overflow-x:clip}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.layout>*{min-width:0}
.side .card,.side .card-b,.side .navlist,.side .navitem{min-width:0}
@media (max-width:1080px){.layout{grid-template-columns:1fr}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;margin:0 0 16px;padding:12px 14px;
  background:linear-gradient(180deg,rgba(11,18,34,.96),rgba(11,18,34,.80));
  backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.brand{display:flex;align-items:center;gap:12px;min-width:230px;flex:1 1 280px}
.brand .logo{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(140deg,rgba(45,212,191,.22),rgba(99,102,241,.26));
  border:1px solid var(--line-strong);
}
.brand h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.1px}
.brand h1 span{background:linear-gradient(90deg,var(--a1),#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;font-size:12px;color:var(--tx-3)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;flex:1 1 240px;min-width:190px}
.search input{
  width:100%;padding:10px 38px 10px 12px;border-radius:12px;
  background:rgba(9,14,26,.85);border:1px solid var(--line);color:var(--tx);
  font-family:inherit;font-size:13.5px;outline:none;transition:.2s;
}
.search input:focus{border-color:rgba(45,212,191,.55);box-shadow:var(--ring)}
.search .ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:14px}
.chips{display:flex;gap:6px;background:rgba(9,14,26,.7);border:1px solid var(--line);padding:4px;border-radius:12px}
.chip{
  border:0;background:transparent;color:var(--tx-2);font-family:inherit;font-size:12.5px;
  padding:6px 11px;border-radius:9px;cursor:pointer;transition:.18s;white-space:nowrap;
}
.chip:hover{color:var(--tx);background:rgba(148,175,224,.10)}
.chip.on{background:linear-gradient(135deg,rgba(45,212,191,.22),rgba(99,102,241,.24));color:#fff;box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:rgba(19,31,56,.75);color:var(--tx);font-family:inherit;font-size:12.5px;font-weight:500;
  padding:9px 12px;border-radius:12px;cursor:pointer;transition:.18s;
}
.btn:hover{border-color:var(--line-strong);transform:translateY(-1px);background:rgba(24,37,65,.9)}
.btn:active{transform:translateY(0)}
.btn.pri{background:linear-gradient(135deg,rgba(45,212,191,.25),rgba(99,102,241,.30));border-color:rgba(45,212,191,.35)}
.btn.danger:hover{border-color:rgba(251,113,133,.5)}
.btn.on{background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,113,133,.18));border-color:rgba(251,191,36,.4)}

/* ---------- progress ring ---------- */
.ring{position:relative;width:56px;height:56px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bgc{stroke:rgba(148,175,224,.14)}
.ring .fgc{stroke:url(#rg);transition:stroke-dashoffset .5s ease}
.ring b{
  position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;
}

/* ---------- sidebar ---------- */
/* مکانیزم اسکرول شماره ۲: سایدبار مستقل از صفحه اسکرول می شود */
.side{
  position:sticky;top:86px;
  display:flex;flex-direction:column;gap:14px;
  max-height:calc(100vh - 104px);
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  padding-inline-end:5px;
  scrollbar-gutter:stable;
}
.side>*{flex:0 0 auto}
/* لیست فازها هم اسکرول داخلی خودش را دارد تا کارت های بالا ثابت بمانند */
.navlist{
  max-height:40vh;overflow-y:auto;overscroll-behavior:contain;
  padding-inline-end:5px;scroll-behavior:smooth;
}
@media (max-width:1080px){
  .side{position:static;max-height:none;overflow:visible;padding-inline-end:0}
  .navlist{max-height:none;overflow:visible}
}
html{scroll-padding-top:96px}
.card{
  background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(12,19,34,.86));
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
}
.card-h{padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h small{font-weight:400;color:var(--tx-3);font-size:11.5px}
.card-b{padding:14px 15px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:rgba(24,37,65,.55);border:1px solid var(--line);border-radius:13px;padding:10px 11px}
.stat b{display:block;font-size:18px;font-weight:700;line-height:1.4}
.stat span{font-size:11px;color:var(--tx-3)}
.stat.ok b{color:var(--ok)}
.stat.warn b{color:var(--warn)}

.pbar{height:9px;border-radius:20px;background:rgba(148,175,224,.13);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .45s ease;box-shadow:0 0 14px rgba(45,212,191,.35)}
.pbar.grad-2>i{background:linear-gradient(90deg,#38bdf8,#a78bfa)}
.meta-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);margin:0 0 6px}

.navlist{display:flex;flex-direction:column;gap:4px}
.navitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.18s;color:var(--tx-2);font-size:12.5px}
.navitem:hover{background:rgba(148,175,224,.08);color:var(--tx)}
.navitem.on{background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.25);color:#fff}
.navitem .ic{width:22px;text-align:center;font-size:14px;flex:0 0 auto}
.navitem .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem .ct{font-size:10.5px;color:var(--tx-3);font-variant-numeric:tabular-nums}

.toolbtns{display:flex;flex-wrap:wrap;gap:7px}
.hint{font-size:11.5px;color:var(--tx-3);line-height:1.9}
.hint code{background:rgba(148,175,224,.12);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#cfe6ff}

/* ---------- phase card ---------- */
.phases{display:flex;flex-direction:column;gap:18px}
.phase{
  background:linear-gradient(180deg,rgba(15,23,42,.85),rgba(11,17,31,.80));
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;scroll-margin-top:100px;position:relative;
}
.phase::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--c,var(--a1));opacity:.85}
.phase.done{border-color:rgba(52,211,153,.32)}
.ph-head{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;cursor:pointer;transition:.2s;position:relative}
.ph-head:hover{background:rgba(148,175,224,.05)}
.ph-ico{
  width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;font-size:21px;
  background:color-mix(in srgb, var(--c,var(--a1)) 15%, transparent);
  border:1px solid color-mix(in srgb, var(--c,var(--a1)) 40%, transparent);
}
.ph-main{flex:1;min-width:0}
.ph-title{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph-badge{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:20px;border:1px solid var(--line-strong);color:var(--tx-2)}
.ph-badge.ok{color:#062;background:rgba(52,211,153,.9);border-color:transparent}
.ph-goal{margin:6px 0 0;font-size:12.5px;color:var(--tx-2);line-height:1.9}
.ph-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:126px}
.ph-pct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ph-pct small{color:var(--tx-3);font-weight:400;font-size:11px}
.ph-caret{transition:.25s;color:var(--tx-3);font-size:12px}
.phase.open .ph-caret{transform:rotate(180deg)}
.ph-progress{padding:0 18px 12px}
.ph-body{padding:4px 18px 18px;border-top:1px solid var(--line);display:none;animation:fade .28s ease}
.phase.open .ph-body{display:block}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.dod{
  margin:14px 0 6px;padding:11px 13px;border-radius:12px;font-size:12.5px;color:#d6f5ea;
  background:linear-gradient(135deg,rgba(52,211,153,.10),rgba(45,212,191,.05));
  border:1px dashed rgba(52,211,153,.32);
}
.dod b{color:#7df0cd}

/* ---------- step ---------- */
.steps{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.step{
  border:1px solid var(--line);border-radius:14px;background:rgba(19,28,48,.55);
  transition:.2s;position:relative;overflow:hidden;
}
.step:hover{border-color:var(--line-strong)}
.step.done{background:rgba(20,40,44,.42);border-color:rgba(52,211,153,.24)}
.step.hit{box-shadow:0 0 0 1px rgba(45,212,191,.5),0 0 22px -6px rgba(45,212,191,.35)}
.st-head{display:flex;gap:12px;align-items:flex-start;padding:13px 14px}
.st-num{
  width:26px;height:26px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:var(--tx-2);background:rgba(148,175,224,.10);border:1px solid var(--line);font-variant-numeric:tabular-nums;
}
.st-main{flex:1;min-width:0}
.st-title{font-weight:500;font-size:14px;line-height:1.85}
.step.done .st-title{color:var(--tx-3)}
.st-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:10.5px;color:var(--tx-2);background:rgba(148,175,224,.10);border:1px solid var(--line);padding:2px 9px;border-radius:20px}
.tag.time{color:#ffe6b0;border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.10)}
.tag.owner{color:#c9d6ff;border-color:rgba(99,102,241,.30);background:rgba(99,102,241,.12)}

/* inline svg icons */
.ic{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.btn .ic{width:16px;height:16px}
.btn.pri .ic{stroke:#c9fff6}
.card-h .ic{width:15px;height:15px;opacity:.9}
.iact .ic{width:13px;height:13px}
.iact.tiny .ic{width:12px;height:12px}
.tag .ic{width:12px;height:12px;vertical-align:-2px}
.ph-caret .ic{width:17px;height:17px}
.search .ico{display:flex;align-items:center}
.search .ico .ic{width:15px;height:15px}
.tip .ti{display:flex;align-items:flex-start;padding-top:3px}
.tip .ti .ic{width:15px;height:15px;stroke:#fbbf24}
.dod .ic{width:14px;height:14px;vertical-align:-2px;stroke:#7df0cd}
.empty .ic{width:22px;height:22px;opacity:.5}
.ic.big{width:21px;height:21px;stroke-width:1.75}
.navitem .ic{display:flex;align-items:center;justify-content:center;width:22px}
.navitem .ic .ic{width:15px;height:15px;opacity:.85}
.ph-ico .em,.navitem .em{font-size:18px;line-height:1}
.ph-ico{display:grid;place-items:center}
body.editing .ph-ico{cursor:text}

/* checkbox */
.ck{position:relative;flex:0 0 auto;margin-top:2px;cursor:pointer;display:inline-flex}
.ck input{position:absolute;opacity:0;width:0;height:0}
.ck .box{
  width:23px;height:23px;border-radius:8px;border:1.6px solid var(--line-strong);
  background:rgba(7,11,20,.7);display:grid;place-items:center;transition:.2s;
}
.ck .box::after{content:'';width:5px;height:9px;border:2.4px solid #04241e;border-top:0;border-left:0;transform:rotate(42deg) translateY(-1px) scale(.6);opacity:0;transition:.2s}
.ck:hover .box{border-color:var(--a1)}
.ck input:checked+.box{background:linear-gradient(135deg,var(--ok),#22d3ee);border-color:transparent}
.ck input:checked+.box::after{opacity:1;transform:rotate(42deg) translateY(-1px) scale(1)}
.ck input:focus-visible+.box{box-shadow:var(--ring)}
.ck.sm .box{width:19px;height:19px;border-radius:6px}
.ck.sm .box::after{width:4px;height:8px;border-width:2.1px;border-top:0;border-left:0}

/* tip */
.tip{
  margin:11px 14px 0;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.95;
  color:#ffe9c7;background:linear-gradient(135deg,rgba(245,158,11,.10),rgba(245,158,11,.04));
  border:1px dashed rgba(245,158,11,.30);display:flex;gap:9px;
}
.tip .ti{flex:0 0 auto;font-size:14px;line-height:1.7}

/* subs */
.subs{margin:12px 6px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
.sub{
  padding:6px 8px;border-radius:11px;transition:.18s;border:1px solid transparent;position:relative;
}
.sub:hover{background:rgba(148,175,224,.06);border-color:var(--line)}
.sub-row{display:flex;gap:9px;align-items:flex-start}
.sub.done .sub-t{color:var(--tx-3);text-decoration:line-through;text-decoration-color:rgba(148,175,224,.35)}
.sub-t{flex:1;font-size:13px;line-height:1.9;min-width:0;padding-top:1px}
.sub .ck{margin-top:3px}
.iact.tiny{padding:1px 6px;font-size:10.5px;border-radius:7px;line-height:1.7}
.note-ind{opacity:.32;padding:1px 5px}
.note-ind:hover{opacity:1}
.note-ind.note-on{opacity:1}
.sub .acts-edit{display:none;align-items:center;gap:4px}
body.editing .sub .acts-edit{display:flex}

/* actions */
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;align-items:center}
.iact{
  border:1px solid var(--line);background:rgba(9,14,26,.6);color:var(--tx-2);border-radius:9px;
  font-family:inherit;font-size:11.5px;padding:4px 9px;cursor:pointer;transition:.18s;display:inline-flex;gap:5px;align-items:center;
}
.iact:hover{color:#fff;border-color:var(--line-strong);background:rgba(24,37,65,.9)}
.iact.d:hover{border-color:rgba(251,113,133,.5);color:#ffd7dd}
.iact.note-on{background:rgba(45,212,191,.14);border-color:rgba(45,212,191,.35);color:#c8fff4}

/* notes */
.note-wrap{display:none;padding:0 14px 14px}
.note-wrap.show{display:block;animation:fade .25s ease}
.note-wrap label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);margin-bottom:6px}
.note{
  width:100%;min-height:78px;resize:vertical;border-radius:12px;padding:11px 12px;
  background:rgba(7,11,20,.72);border:1px solid var(--line);color:var(--tx);
  font-family:inherit;font-size:12.5px;line-height:1.95;outline:none;transition:.2s;
}
.note:focus{border-color:rgba(45,212,191,.5);box-shadow:var(--ring)}
.note::placeholder{color:#5f6d8c}
.note.has{background:linear-gradient(135deg,rgba(45,212,191,.07),rgba(7,11,20,.72));border-color:rgba(45,212,191,.28)}
.subnote{margin:0 28px 4px 0;padding:0 0 4px}
.subnote .note{min-height:56px;font-size:12px}

/* edit mode */
body.editing .st-title,.edit-hint{outline:1px dashed rgba(251,191,36,.35);outline-offset:3px;border-radius:6px}
body.editing [contenteditable="true"]:focus{outline:1.5px solid rgba(251,191,36,.75);background:rgba(251,191,36,.06)}
.editbar{
  display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;
  background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(251,113,133,.06));
  border-top:1px solid rgba(251,191,36,.22);border-bottom:1px solid rgba(251,191,36,.22);
  font-size:11.5px;color:#ffe6b0;
}
body.editing .editbar{display:flex}
body.editing .acts{display:flex}
.acts-edit{display:none;gap:6px;flex-wrap:wrap}
body.editing .acts-edit{display:flex}

/* banner */
.banner{
  display:none;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:11px 14px;border-radius:14px;
  background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(45,212,191,.08));border:1px solid rgba(99,102,241,.35);font-size:12.5px;
}
.banner.show{display:flex}

/* footer */
.foot{margin-top:34px;padding:16px;text-align:center;color:var(--tx-3);font-size:11.5px;line-height:2}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;color:var(--tx-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}

.toast{
  position:fixed;z-index:99;bottom:22px;left:50%;transform:translate(-50%,26px);opacity:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(45,212,191,.22),rgba(99,102,241,.26));
  border:1px solid rgba(45,212,191,.4);color:#fff;padding:10px 18px;border-radius:14px;font-size:12.5px;
  backdrop-filter:blur(10px);transition:.3s;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.empty{padding:40px;text-align:center;color:var(--tx-3);font-size:13px}
kbd{background:rgba(148,175,224,.12);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-family:inherit;font-size:11px}

/* ---------- کارت توسعه دهنده ---------- */
.dev-card{overflow:hidden}
.dev-card>summary{list-style:none;cursor:pointer;user-select:none}
.dev-card>summary::-webkit-details-marker{display:none}
.dev-card>summary::after{content:'▾';color:var(--tx-3);font-size:11px;transition:.2s}
.dev-card[open]>summary::after{transform:rotate(180deg)}
.dev-card .hint code{white-space:normal;overflow-wrap:anywhere;font-size:10.5px}
.dev-card .card-b{padding:12px 15px 14px}

/* ---------- نشانگر حالت ویرایش ---------- */
body.editing::after{
  content:'✎ حالت ویرایش فعال';position:fixed;bottom:74px;right:18px;z-index:60;
  background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(251,113,133,.16));
  border:1px solid rgba(251,191,36,.45);color:#ffe6b0;font-size:11.5px;font-family:'Vazir',Tahoma,sans-serif;
  padding:7px 13px;border-radius:13px;backdrop-filter:blur(10px);box-shadow:var(--shadow);pointer-events:none;
}
body.editing .topbar{border-color:rgba(251,191,36,.35)}

/* ---------- موبایل ---------- */
@media (max-width:1080px){
  .topbar{position:static}
  .side{display:flex;flex-direction:column}
}
@media (max-width:720px){
  .wrap{padding:12px 12px 44px}
  .brand h1{font-size:15px}
  .brand p{font-size:11px}
  .search{flex:1 1 100%;order:3}
  .chips{flex:1 1 100%;justify-content:space-between;order:4}
  .tools{flex:1 1 100%;order:5}
  .tools .btn{flex:1 1 calc(50% - 8px);justify-content:center}
  .ph-head{padding:13px 12px;gap:10px}
  .ph-ico{width:38px;height:38px;border-radius:11px}
  .ph-ico .ic.big{width:18px;height:18px}
  .ph-side{min-width:96px}
  .ph-side>div{width:96px!important}
  .ph-body{padding:2px 12px 14px}
  .ph-progress{padding:0 12px 10px}
  .steps{gap:9px}
  .tip{margin:10px 10px 0}
  .subs{margin:10px 2px 0}
  .acts{padding:0 10px 12px}
  .note-wrap{padding:0 10px 12px}
  .st-head{padding:11px 10px;gap:9px}
  .st-meta .tag{font-size:10px}
  .brand{flex:1 1 100%}
}

/* ---------- دکمه بازگشت به بالا ---------- */
.totop{
  position:fixed;bottom:18px;left:18px;z-index:60;display:flex;align-items:center;gap:6px;
  background:rgba(19,31,56,.9);border:1px solid var(--line-strong);color:var(--tx);
  font-family:inherit;font-size:11.5px;padding:8px 13px;border-radius:13px;cursor:pointer;
  backdrop-filter:blur(10px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;
}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{border-color:rgba(45,212,191,.5)}


/* ==================== دفترچه یادداشت (Drawer) ==================== */
.fab{
  position:fixed;bottom:18px;right:18px;z-index:70;display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,rgba(45,212,191,.26),rgba(99,102,241,.3));
  border:1px solid rgba(45,212,191,.45);color:#eafffb;font-family:inherit;font-size:12.5px;font-weight:500;
  padding:11px 15px;border-radius:16px;cursor:pointer;backdrop-filter:blur(12px);
  box-shadow:0 14px 34px -16px rgba(0,0,0,.95);transition:.22s;
}
.fab:hover{transform:translateY(-2px);border-color:rgba(45,212,191,.75)}
.fab .ic.big{width:18px;height:18px}
.fab-dot{width:9px;height:9px;border-radius:50%;background:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.9)}
body.nb-open .fab{right:min(calc(92vw + 18px), calc(460px + 18px));left:auto}
@media (max-width:720px){body.nb-open .fab{left:18px;right:auto;bottom:74px}}
.nb-overlay{
  position:fixed;inset:0;z-index:80;background:rgba(3,6,12,.55);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:.25s;
}
.nb-overlay.show{opacity:1;pointer-events:auto}
.nb{
  position:fixed;top:0;right:0;bottom:0;z-index:85;width:min(460px,92vw);
  display:flex;flex-direction:column;gap:0;
  background:linear-gradient(180deg,#0d1424 0%,#0a101d 100%);
  border-left:1px solid var(--line-strong);
  box-shadow:-24px 0 60px -30px rgba(0,0,0,1);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.nb.open{transform:none}
.nb-head{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.nb-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;flex:1;min-width:0}
.nb-title small{font-weight:400;font-size:10.5px;color:var(--tx-3);border:1px solid var(--line);padding:1px 6px;border-radius:20px}
.nb-state{font-size:10.5px;color:var(--tx-3);white-space:nowrap}
.nb-tools{display:flex;flex-direction:column;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(9,14,26,.4)}
.nb-format,.nb-actions{display:flex;flex-wrap:wrap;gap:6px}
.nb-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.nb.hide-preview .nb-body{grid-template-columns:1fr}
.nb.hide-preview .nb-preview{display:none}
.nb-edit{
  width:100%;height:100%;min-height:220px;resize:none;border-radius:12px;padding:12px;
  background:rgba(7,11,20,.75);border:1px solid var(--line);color:var(--tx);
  font-family:ui-monospace,'Vazir',Menlo,monospace;font-size:12.5px;line-height:2;outline:none;transition:.2s;
}
.nb-edit:focus{border-color:rgba(45,212,191,.5);box-shadow:var(--ring)}
.nb-preview{
  overflow:auto;border-radius:12px;padding:12px 14px;background:rgba(7,11,20,.45);
  border:1px solid var(--line);font-size:12.5px;line-height:2;
}
.nb-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--tx-3)}
.nb-save{color:#7df0cd}
@media (max-width:720px){
  .nb-body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .nb.hide-preview .nb-body{grid-template-rows:1fr}
  .nb-preview{max-height:38vh}
}

/* ==================== رندر Markdown ==================== */
.md{overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 8px;line-height:1.7}
.md h1{font-size:19px}.md h2{font-size:16.5px}.md h3{font-size:14.5px}.md h4,.md h5,.md h6{font-size:13.5px}
.md h1,.md h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.md p{margin:9px 0}
.md ul,.md ol{margin:8px 0;padding-inline-start:22px}
.md li{margin:3px 0}
.md li.md-task{list-style:none;margin-inline-start:-18px}
.md code{background:rgba(148,175,224,.14);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#cfe6ff;direction:ltr;display:inline-block}
.md .md-pre{background:rgba(3,6,12,.75);border:1px solid var(--line);border-radius:10px;padding:11px 12px;overflow:auto;direction:ltr;text-align:left}
.md .md-pre code{background:none;padding:0;color:#d6e6ff}
.md blockquote{margin:10px 0;padding:8px 12px;border-inline-start:3px solid rgba(45,212,191,.6);background:rgba(45,212,191,.07);border-radius:0 10px 10px 0;color:var(--tx-2)}
.md hr{border:0;border-top:1px dashed var(--line-strong);margin:14px 0}
.md a{color:var(--a1);text-decoration:underline;text-underline-offset:3px}
.md mark{background:rgba(251,191,36,.28);color:#fff;border-radius:4px;padding:0 3px}
.md del{opacity:.6}
.md-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:11.5px}
.md-table th,.md-table td{border:1px solid var(--line);padding:6px 8px;text-align:right}
.md-table th{background:rgba(148,175,224,.1)}
.md-empty{color:var(--tx-3);font-style:italic}

/* ==================== منوی کشویی ==================== */
.menu-wrap{position:relative;display:inline-flex}
.menu-wrap .caret{font-style:normal;font-size:9px;opacity:.7}
.menu-pop{
  position:absolute;top:calc(100% + 8px);right:0;z-index:60;min-width:250px;display:none;
  flex-direction:column;gap:2px;padding:7px;border-radius:14px;
  background:linear-gradient(180deg,#131f38,#0e1728);border:1px solid var(--line-strong);box-shadow:var(--shadow);
}
.menu-wrap.open .menu-pop{display:flex;animation:fade .18s ease}
.menu-pop button{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:transparent;border:0;color:var(--tx);font-family:inherit;font-size:12.5px;
  padding:9px 11px;border-radius:10px;cursor:pointer;text-align:right;transition:.16s;
}
.menu-pop button:hover{background:rgba(45,212,191,.12)}
.menu-pop button b{color:var(--tx-3);font-weight:500;font-size:11px}
.menu-sep{height:1px;background:var(--line);margin:4px 2px}

/* ==================== مودال متن (گزارش/دفترچه) ==================== */
.modal{position:fixed;inset:0;z-index:95;display:none;place-items:center;padding:20px;background:rgba(3,6,12,.72);backdrop-filter:blur(4px)}
.modal.show{display:grid}
.modal-panel{
  width:min(900px,96vw);max-height:88vh;display:flex;flex-direction:column;gap:0;overflow:hidden;
  background:linear-gradient(180deg,#101a2e,#0b1220);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow);
}
.modal-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:13.5px}
.modal-head b{flex:0 0 auto}
.modal-hint{flex:1;font-size:11px;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}
.modal-text{
  flex:1;min-height:260px;margin:12px 15px;padding:13px;border-radius:12px;resize:none;
  background:rgba(5,9,17,.8);border:1px solid var(--line);color:var(--tx);
  font-family:ui-monospace,'Vazir',Menlo,monospace;font-size:12px;line-height:2;outline:none;
}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 15px;border-top:1px solid var(--line)}
.modal-note{font-size:11px;color:var(--tx-3);flex:1 1 220px}
body.modal-open{overflow:hidden}

/* ==================== کارت محل ذخیره ==================== */
.store-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--tx-2);line-height:1.9}
.store-row b{direction:ltr;display:inline-block;color:#cfe6ff}
.store-row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:8px;background:#64748b}
.store-row .dot.ok{background:#34d399;box-shadow:0 0 10px rgba(52,211,153,.85)}
.store-row .dot.err{background:#fb7185}
.store-row .dot.off{background:#94a3b8}
.store-state{font-size:10.5px;color:var(--tx-3);margin-top:5px}
.iact.on{background:rgba(45,212,191,.16);border-color:rgba(45,212,191,.4);color:#c8fff4}


/* ================================================================
   بازبینی نهایی: تم چشم نوازتر (Eye-Friendly) + سایدبار تمام قد و
   تاشو + درخت فاز/مرحله + هایلایت استک + دفترچه پهن چندیادداشتی
   کنتراست کمتر، نورهای نئونی ملایم تر و متن خاکستریِ نرم برای
   استفاده طولانی مدت بدون خستگی چشم.
   ================================================================ */
:root{
  --bg:#0d1219;
  --bg-2:#111826;
  --surface:#151d2b;
  --surface-2:#1a2436;
  --surface-3:#202c42;
  --line:rgba(163,179,204,.13);
  --line-strong:rgba(163,179,204,.24);
  --tx:#dbe2ef;
  --tx-2:#a9b4c8;
  --tx-3:#7e8aa0;
  --a1:#43b3a2;
  --a2:#7b7fd4;
  --a3:#d9a84e;
  --ok:#57b98c;
  --warn:#e0b45c;
  --danger:#df8291;
  --shadow:0 14px 34px -20px rgba(0,0,0,.82);
  --ring:0 0 0 3px rgba(67,179,162,.16);
}
body{
  background:
    radial-gradient(1100px 620px at 88% -12%, rgba(123,127,212,.07), transparent 62%),
    radial-gradient(900px 520px at 6% 0%, rgba(67,179,162,.05), transparent 60%),
    linear-gradient(180deg,#0d1219 0%,#0e141f 45%,#0b0f16 100%);
  color:var(--tx);
  line-height:2.02;
}
body::before{opacity:.28}
::selection{background:rgba(67,179,162,.26)}
.topbar{background:linear-gradient(180deg,rgba(17,24,38,.95),rgba(15,21,33,.88))}
.card{background:linear-gradient(180deg,rgba(21,29,43,.94),rgba(17,24,37,.9))}
.phase{background:linear-gradient(180deg,rgba(21,29,43,.88),rgba(16,22,34,.84))}
.step{background:rgba(25,34,52,.5)}
.step.done{background:rgba(24,42,40,.38)}
.brand h1 span{background:linear-gradient(90deg,#6fc7b8,#a3a8ea);-webkit-background-clip:text;background-clip:text}
.pbar>i{box-shadow:none;background:linear-gradient(90deg,#43b3a2,#7b7fd4)}
.ck input:checked+.box{background:linear-gradient(135deg,#57b98c,#43b3a2)}
.tip{color:#e3d7ba;background:linear-gradient(135deg,rgba(217,168,78,.08),rgba(217,168,78,.03));border-color:rgba(217,168,78,.26)}
.dod{color:#cde8dc}
.chip.on,.btn.pri{background:linear-gradient(135deg,rgba(67,179,162,.18),rgba(123,127,212,.2))}
.fab{background:linear-gradient(135deg,rgba(67,179,162,.22),rgba(123,127,212,.24));border-color:rgba(67,179,162,.4);color:#eef7f4}

/* ---------- شماره های خودکار فاز/مرحله/زیرمرحله ---------- */
.ph-num,.sub-num{
  display:inline-grid;place-items:center;flex:0 0 auto;
  font-variant-numeric:tabular-nums;font-weight:700;
}
.ph-num{
  font-size:11px;color:#0e2a24;background:linear-gradient(135deg,#6fc7b8,#8f96e8);
  padding:2px 10px;border-radius:20px;line-height:1.8;white-space:nowrap;
}
.st-num{width:auto;min-width:30px;padding:1px 7px;color:#cfe8e1;background:rgba(67,179,162,.12);border-color:rgba(67,179,162,.25)}
.sub-num{font-size:10px;color:var(--tx-3);min-width:34px;justify-content:start;padding-top:5px}

/* ---------- فیلتر استک: فونت وزیر + هایلایت کلمه استک ---------- */
.stack-chips{display:flex;flex-wrap:wrap;gap:6px}
.schip,.stack-chips,.stack-active-note{
  font-family:'Vazir','Vazirmatn',Tahoma,system-ui,sans-serif;
}
.schip{
  border:1px solid var(--line);background:rgba(24,36,58,.62);color:var(--tx-2);
  font-size:12px;font-weight:500;line-height:1.9;padding:5px 11px;border-radius:20px;cursor:pointer;transition:.18s;
}
.schip b{color:var(--tx-3);font-weight:700}
.schip:hover{color:var(--tx);border-color:var(--line-strong);background:rgba(32,44,66,.85)}
.schip.on{
  color:#eafff8;border-color:rgba(67,179,162,.55);
  background:linear-gradient(135deg,rgba(67,179,162,.24),rgba(123,127,212,.24));
  box-shadow:0 0 0 1px rgba(67,179,162,.18);
}
mark.hl-stack,.hl-stack{
  background:rgba(224,180,92,.34);color:#fff3d6;border:1px solid rgba(224,180,92,.35);
  border-radius:5px;padding:0 3px;font-weight:700;
}
.md mark.hl-stack{background:rgba(224,180,92,.34);color:#fff3d6}
.tag.stk.hl-tag{border-color:rgba(224,180,92,.6);background:rgba(224,180,92,.14);color:#fff3d6}
.stack-active-note{
  margin-top:9px;font-size:11.5px;color:var(--tx-2);line-height:1.95;
  background:rgba(224,180,92,.07);border:1px dashed rgba(224,180,92,.3);border-radius:10px;padding:7px 10px;
}

/* ---------- سایدبار: تمام قد تا پایین صفحه + اسکرول مستقل ---------- */
.side{
  top:96px;
  height:calc(100vh - 114px);
  max-height:calc(100vh - 114px);
  align-self:start;
}
.side-card{display:flex;flex-direction:column;overflow:hidden}
.side-card .card-b{min-width:0}
.phases-card{flex:1 1 auto;min-height:170px}
.phases-card .card-b{flex:1;min-height:0;display:flex;flex-direction:column}
.phases-card .navlist{flex:1;max-height:none;min-height:0}
button.card-h.side-h{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  color:var(--tx);font-family:'Vazir','Vazirmatn',Tahoma,sans-serif;text-align:right;cursor:pointer;
}
.side-card.closed .card-h{border-bottom:0}
.side-h{justify-content:space-between}
.side-h-t{display:inline-flex;align-items:center;gap:7px;min-width:0}
.side-h-r{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto}
.side-chev{display:inline-flex;transition:transform .22s;color:var(--tx-3)}
.side-card .side-chev{transform:rotate(180deg)}
.side-card.closed .side-chev{transform:none}
.side-chev .ic{width:14px;height:14px}

/* درخت فاز/مرحله در سایدبار */
.tree-ph{margin-bottom:2px}
.tree-toggle{
  width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;
  background:transparent;border:1px solid transparent;border-radius:7px;color:var(--tx-3);cursor:pointer;padding:0;
}
.tree-toggle:hover{color:var(--tx);background:rgba(148,175,224,.1)}
.tree-toggle .ic{width:13px;height:13px;transition:transform .2s}
.tree-toggle.open .ic{transform:rotate(180deg)}
.nav-num{color:#8fd8c9;font-weight:700}
.tree-steps{margin:2px 0 6px;padding-inline-start:28px;display:flex;flex-direction:column;gap:2px}
.navstep{
  display:flex;align-items:flex-start;gap:7px;padding:5px 8px;border-radius:9px;cursor:pointer;
  color:var(--tx-2);font-size:11.5px;line-height:1.8;border:1px solid transparent;transition:.16s;min-width:0;
}
.navstep:hover{background:rgba(148,175,224,.08);color:var(--tx)}
.navstep .ns-num{font-size:10px;color:var(--tx-3);font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:2px}
.navstep .ns-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navstep.done .ns-tt{color:var(--tx-3)}
.navstep .ns-ok{color:var(--ok);flex:0 0 auto}
.ns-empty{font-size:11px;color:var(--tx-3);padding:4px 8px}

/* ---------- دفترچه چندیادداشتی (پهن، شبیه Obsidian) ---------- */
.nb{width:min(920px,96vw)}
body.nb-open .fab{right:min(calc(96vw + 18px), calc(920px + 18px))}
.nb-total{
  background:rgba(67,179,162,.16);border:1px solid rgba(67,179,162,.35);color:#c9f2e7;
  font-size:10.5px;border-radius:20px;padding:0 8px;line-height:1.9;
}
.nb-listview,.nb-noteview{display:flex;flex-direction:column;min-height:0;flex:1}
.nb-listview[hidden],.nb-noteview[hidden]{display:none!important}
.nb-listtools{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(9,14,26,.35);flex-wrap:wrap}
.nb-search{position:relative;flex:1 1 240px;min-width:180px}
.nb-search input{
  width:100%;padding:9px 36px 9px 12px;border-radius:11px;background:rgba(7,11,20,.7);
  border:1px solid var(--line);color:var(--tx);font-family:'Vazir','Vazirmatn',Tahoma,sans-serif;font-size:12.5px;outline:none;
}
.nb-search input:focus{border-color:rgba(67,179,162,.5);box-shadow:var(--ring)}
.nb-search .ico{position:absolute;right:11px;top:50%;transform:translateY(-50%);display:flex;opacity:.55}
.nb-list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-height:0}
.nb-card{
  display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:13px;cursor:pointer;
  background:rgba(21,30,48,.62);border:1px solid var(--line);transition:.18s;
}
.nb-card:hover{border-color:var(--line-strong);background:rgba(28,39,62,.8);transform:translateY(-1px)}
.nb-card.active{border-color:rgba(67,179,162,.5);background:linear-gradient(135deg,rgba(67,179,162,.1),rgba(21,30,48,.62))}
.nb-card-main{flex:1;min-width:0}
.nb-card-main b{display:block;font-size:13.5px;line-height:1.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-card-main p{margin:3px 0 5px;font-size:12px;color:var(--tx-2);line-height:1.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb-card-meta{font-size:10.5px;color:var(--tx-3)}
.nb-card-acts{display:flex;gap:4px;flex:0 0 auto}
.nb-empty{padding:38px 18px;text-align:center;color:var(--tx-3);font-size:12.5px;line-height:2;border:1px dashed var(--line-strong);border-radius:13px}
.nb-note-top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px 0;flex-wrap:wrap}
.nb-back{font-family:'Vazir','Vazirmatn',Tahoma,sans-serif}
.nb-mode-toggle.on{background:rgba(67,179,162,.16);border-color:rgba(67,179,162,.45);color:#d8fff4}
.nb-title-row{padding:10px 14px 0}
.nb-title-input{
  width:100%;padding:10px 12px;border-radius:12px;background:rgba(7,11,20,.62);border:1px solid var(--line);
  color:var(--tx);font-family:'Vazir','Vazirmatn',Tahoma,sans-serif;font-size:15px;font-weight:700;outline:none;
}
.nb-title-input:focus{border-color:rgba(67,179,162,.5);box-shadow:var(--ring)}
.nb-tools{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
.nb-format{align-items:center}
.nb-sep{width:1px;height:20px;background:var(--line-strong);margin:0 2px}
.nb-body{display:block;padding:12px 14px;flex:1;min-height:0}
.nb-body .nb-edit,.nb-body .nb-preview{width:100%;height:100%}
.nb-preview{max-height:none}
.nb.mode-read .nb-tools .nb-actions{margin-inline-start:auto}

@media (max-width:1080px){
  .side{height:auto;max-height:none}
  .phases-card{flex:0 0 auto;min-height:0}
  .phases-card .navlist{max-height:52vh}
}
@media (max-width:720px){
  .nb{width:100vw}
  body.nb-open .fab{left:14px;right:auto;bottom:74px}
  .nb-note-top,.nb-listtools{padding-inline:10px}
  .nb-title-row{padding-inline:10px}
  .nb-body{padding:10px}
  .sub-num{min-width:28px}
}

/* ---------- تبلت ---------- */
@media (min-width:721px) and (max-width:1180px){
  .layout{grid-template-columns:290px minmax(0,1fr);gap:16px}
  .nb{width:min(860px,97vw)}
  .tools .btn{padding:8px 10px}
}


body{overflow-x:clip}


/* درخت عمیق سایدبار: فاز ← مرحله ← زیرمرحله (هر سطح باز/بسته می شود) */
.tree-step-wrap{min-width:0}
.tree-step-toggle{
  width:17px;height:19px;flex:0 0 auto;display:grid;place-items:center;
  padding:0;border:0;background:transparent;color:var(--tx-3);cursor:pointer;border-radius:5px;
}
.tree-step-toggle:hover{color:var(--tx);background:rgba(148,175,224,.1)}
.tree-step-toggle .ic{width:11px;height:11px;transition:transform .16s}
.tree-step-toggle.open .ic{transform:rotate(180deg)}
.navstep{gap:5px}
.tree-subs{margin:2px 0 5px 23px;padding-left:8px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.navsub{display:flex;align-items:flex-start;gap:5px;padding:4px 6px;border-radius:7px;cursor:pointer;color:var(--tx-3);font-size:10.5px;line-height:1.65;transition:.15s;min-width:0}
.navsub:hover{background:rgba(148,175,224,.09);color:var(--tx)}
.navsub.done .nsub-tt{color:#718071}
.nsub-num{color:#8291a8;flex:0 0 auto;font-size:9px;font-variant-numeric:tabular-nums;padding-top:1px}
.nsub-tt{min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.navsub .mini-flag,.navsub .mini-arch{margin-inline-start:auto}
@media(max-width:720px){.tree-subs{margin-left:14px}}

/* ---------- نشان ها، آرشیو و منوی عملیات هر مورد (نسخه 1.0.0) ---------- */
.phase,.step,.sub{scroll-margin-top:110px}
.tag.review-tag{color:#ffe1a8;border-color:rgba(224,180,92,.55);background:rgba(224,180,92,.13)}
.tag.arch-tag{color:#c7cede;border-color:rgba(148,163,184,.45);background:rgba(148,163,184,.12)}
.step.is-archived,.phase.is-archived{opacity:.78}
.sub.is-archived{opacity:.72}
.step.needs-review{border-color:rgba(224,180,92,.42)}
.sub.needs-review{background:rgba(224,180,92,.06)}
.ent-btn{opacity:.5;flex:0 0 auto}
.ent-btn:hover,.sub:hover .ent-btn,.step:hover .ent-btn,.phase:hover .ent-btn{opacity:1}
.ent-btn .ic{width:14px;height:14px}
.entity-menu{
  position:fixed;z-index:120;width:264px;padding:7px;border-radius:14px;
  background:linear-gradient(180deg,#17233a,#101a2c);border:1px solid var(--line-strong);
  box-shadow:0 22px 50px -18px rgba(0,0,0,.95);font-family:'Vazir','Vazirmatn',Tahoma,sans-serif;
}
.entity-menu[hidden]{display:none!important}
.entity-menu .em-head{padding:8px 10px 9px;border-bottom:1px solid var(--line);margin-bottom:5px}
.entity-menu .em-head b{display:block;font-size:12.5px;line-height:1.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entity-menu .em-head span{font-size:10.5px;color:var(--tx-3)}
.entity-menu>button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:right;
  background:transparent;border:0;color:var(--tx);font-family:inherit;font-size:12.5px;
  padding:9px 10px;border-radius:10px;cursor:pointer;transition:.15s;
}
.entity-menu>button:hover{background:rgba(67,179,162,.13)}
.entity-menu>button b{margin-inline-start:auto;font-size:10px;color:#8fd8c9;font-weight:500}
.entity-menu>button .ic{width:15px;height:15px}
.mark-chips .chip.mk.on,.schip.mk.on{
  color:#fff0d2;border-color:rgba(224,180,92,.6);
  background:linear-gradient(135deg,rgba(224,180,92,.22),rgba(224,180,92,.08));
}
.mark-chips .chip b,.schip.mk b{color:inherit;opacity:.75}
.mini-flag,.mini-arch{display:inline-flex;color:#e0b45c;flex:0 0 auto}
.mini-arch{color:#94a3b8}
.mini-flag .ic,.mini-arch .ic{width:12px;height:12px}
@media print{.entity-menu,.ent-btn{display:none!important}}

/* ---------- print ---------- */
@media print{
  body{background:#fff;color:#111}
  body::before{display:none}
  .topbar,.side,.acts,.acts-edit,.editbar,.banner,.toast,.ph-side .ph-caret,.iact,.totop,.fab,.nb-tools,.nb-foot,.modal-foot{display:none!important}
  .nb-overlay{display:none!important}
  .nb{position:static;width:auto;transform:none;border:0;box-shadow:none;background:#fff}
  .nb-body{grid-template-columns:1fr!important}
  .nb-preview{border:1px solid #ccc;background:#fff;color:#111}
  .nb-edit{background:#f7f7f7;border:1px solid #ddd;color:#111;min-height:auto}
  .layout{display:block}
  .phase,.card,.step{border:1px solid #ccc;box-shadow:none;background:#fff;break-inside:avoid}
  .ph-body{display:block!important}
  .note-wrap{display:block!important}
  .note{background:#f7f7f7;border:1px solid #ddd;color:#111;min-height:auto}
  .st-title,.ph-title,.ph-goal,.sub-t,.tip,.dod,.note{color:#111!important}
  .tip,.dod{background:#fafafa;border-color:#ccc}
  .phase::before{display:none}
}

<!-- =====================================================================
     ۲) موتور برنامه (وضعیت، رندر، ذخیره سازی، خروجی ها)
     ===================================================================== -->
<script>
/* =====================================================================
 *  APP — موتور برنامه (بدون هیچ وابستگی خارجی)
 *  ذخیره سازی: localStorage (با fallback حافظه ای) + خروجی/ورودی JSON
 * ===================================================================== */
(function () {
  'use strict';

  /* ---------- ثابت ها -------------------------------------------------- */
  const STORE_KEY = 'packpolymer-marketplace-roadmap-v2';
  const CONTENT_VERSION = '2.0';
  const APP_VERSION = '1.0.0';
  const COLORS = ['#38bdf8', '#a78bfa', '#34d399', '#f59e0b', '#f472b6', '#22d3ee', '#facc15', '#fb7185', '#4ade80', '#94a3b8', '#c084fc'];
  const META_SRC = (typeof PLAN_META !== 'undefined') ? PLAN_META : {};
  const DEF_TITLE = 'پک پلیمر (Packpolymer) — نقشه راه ساخت بازارگاه B2B و فروشگاه B2C پلیمر و سیلیکون';
  const DEF_SUB = 'استک پروژه: Woodmart + Elementor + WooCommerce + Dokan Pro + Rank Math Pro + Wordfence · قابل ویرایش، با یادداشت برای هر مرحله و زیرمرحله';
  const STACK = (META_SRC.stack && META_SRC.stack.length) ? META_SRC.stack.slice() : [];
  const BRAND = META_SRC.brand || 'Packpolymer — پک پلیمر';

  /* ---------- ابزارهای کمکی -------------------------------------------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const uid = (p) => p + '-' + Math.random().toString(36).slice(2, 8);
  /* آیکون SVG داخلی (بدون وابستگی بیرونی) — نام ها در انتهای فایل به صورت <symbol> تعریف شده اند */
  const I = (n, cls) => '<svg class="ic ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + n + '" xlink:href="#i-' + n + '"></use></svg>';
  /* آیکون های آماده برای فازها؛ در حالت ویرایش، جای آیکون می توانی نام یکی از این ها را بنویسی:
     compass, server, cart, palette, building, package, flask, zap, megaphone, rocket, paperclip, more … */
  const KNOWN_ICONS = ['compass','server','cart','palette','building','package','flask','zap','megaphone','rocket','paperclip','more','tools','chart','phases','target','bulb','check'];
  const iconOf = (v, cls) => (KNOWN_ICONS.indexOf(String(v).trim()) !== -1)
      ? I(String(v).trim(), 'big ' + (cls || ''))
      : '<span class="em">' + esc(v) + '</span>';
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  const fa = (n) => String(n).replace(/[0-9]/g, (d) => FA_DIGITS[+d]);
  const pct = (d, t) => (t ? Math.round((d / t) * 100) : 0);

  /* ---------- نرمال سازی متن برای جست وجو -------------------------------
   * اعداد فارسی/عربی → انگلیسی، ي/ك عربی → ی/ک، حذف نیم فاصله و اعراب،
   * یکدست سازی فاصله ها. بهاین ترتیب «فاز 1» == «فاز ۱» و «می شود» == «میشود».
   * ------------------------------------------------------------------- */
  const DIGIT_MAP = { '\u06f0':'0','\u06f1':'1','\u06f2':'2','\u06f3':'3','\u06f4':'4','\u06f5':'5','\u06f6':'6','\u06f7':'7','\u06f8':'8','\u06f9':'9',
                      '\u0660':'0','\u0661':'1','\u0662':'2','\u0663':'3','\u0664':'4','\u0665':'5','\u0666':'6','\u0667':'7','\u0668':'8','\u0669':'9' };
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[\u06f0-\u06f9\u0660-\u0669]/g, (d) => DIGIT_MAP[d])
      .replace(/[\u064a\u0649]/g, '\u06cc')      // ي / ى → ی
      .replace(/\u0643/g, '\u06a9')                // ك → ک
      .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627') // أ إ آ ٱ → ا
      .replace(/\u0629/g, '\u0647')                // ة → ه
      .replace(/[\u064b-\u0652\u0640]/g, '')      // اعراب و کشیده
      .replace(/[\u200c\u200d\u200e\u200f]/g, ' ') // کنترل های قدیمی را به فاصله معمولی تبدیل کن
      .replace(/[\u00a0\t\r\n]+/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }
  /* کش متنِ نرمال شده هر مرحله (WeakMap → در JSON ذخیره نمی شود) */
  const HAY = new WeakMap();
  function invalidateHay(stepObj) { HAY.delete(stepObj); }

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* ---------- ذخیره سازی (با fallback برای iframe سندباکس) -------------- */
  const store = (function () {
    let ok = true, mem = null;
    try {
      window.localStorage.setItem('__t', '1');
      window.localStorage.removeItem('__t');
    } catch (e) { ok = false; }
    return {
      available: ok,
      get() {
        try { return ok ? window.localStorage.getItem(STORE_KEY) : mem; } catch (e) { return mem; }
      },
      set(v) {
        if (ok) { try { window.localStorage.setItem(STORE_KEY, v); } catch (e) { ok = false; mem = v; } }
        else mem = v;
      },
      del() {
        if (ok) { try { window.localStorage.removeItem(STORE_KEY); } catch (e) { } }
        mem = null;
      }
    };
  })();

  /* ---------- فایل کناری پاسخ ها (answers-roadmap.json) ------------------
   * هدف: همه پاسخ ها (تیک ها، یادداشت ها و دفترچه) به صورت پیش فرض در فایل
   * «answers-roadmap.json» که کنار همین فایل HTML است ذخیره شود.
   *  · اگر مرورگر از File System Access API پشتیبانی کند (کروم/اج/اُپرا):
   *    یک بار فایل را انتخاب می کنی و از آن به بعد ذخیره خودکار در همان فایل است.
   *  · اگر فایل از طریق http(s) باز شده باشد، در شروع کار همان فایل خوانده
   *    می شود (بارگذاری خودکار پاسخ ها).
   *  · در غیر این صورت (یا در پیش نمایش داخل برنامه) ذخیره سازی روی
   *    localStorage انجام می شود و همه چیز بدون خطا کار می کند.
   * ------------------------------------------------------------------- */
  const SIDECAR = 'answers-roadmap.json';
  const APP_ID = 'packpolymer-marketplace-roadmap';

  const idb = (function () {
    let db = null;
    function open() {
      return new Promise((res) => {
        try {
          if (!window.indexedDB) return res(null);
          const rq = indexedDB.open('packpolymer-roadmap', 1);
          rq.onupgradeneeded = () => { try { rq.result.createObjectStore('kv'); } catch (e) { } };
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    }
    return {
      async set(k, v) {
        const d = await open(); if (!d) return false;
        return new Promise((res) => {
          try {
            const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k);
            tx.oncomplete = () => res(true); tx.onerror = () => res(false);
          } catch (e) { res(false); }
        });
      },
      async get(k) {
        const d = await open(); if (!d) return null;
        return new Promise((res) => {
          try {
            const tx = d.transaction('kv', 'readonly'); const rq = tx.objectStore('kv').get(k);
            rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
          } catch (e) { res(null); }
        });
      },
      async del(k) {
        const d = await open(); if (!d) return false;
        return new Promise((res) => {
          try {
            const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k);
            tx.oncomplete = () => res(true); tx.onerror = () => res(false);
          } catch (e) { res(false); }
        });
      }
    };
  })();

  const fileStore = {
    handle: null,
    connected: false,
    status: 'idle',      // idle | connected | error | busy
    lastSaved: '',
    supported() { return typeof window.showOpenFilePicker === 'function'; },
    answerPayload() {
      return {
        app: APP_ID, kind: 'answers', version: 2,
        savedAt: new Date().toISOString(),
        appVersion: APP_VERSION,
        checks: state.checks, notes: state.notes, marks: state.marks,
        notebook: nbAllText(),
        nbNotes: state.nbNotes || [],
        nbActiveId: state.nbActiveId || '',
        nbMode: state.nbMode || 'edit',
        nbView: state.nbView || 'list',
        customized: !!state.customized
      };
    },
    async connect() {
      if (!this.supported()) {
        toast('این مرورگر اتصال مستقیم فایل را پشتیبانی نمی کند؛ از «خروجی JSON» استفاده کن.');
        return false;
      }
      try {
        const [h] = await window.showOpenFilePicker({
          multiple: false, id: 'packpolymer-answers', startIn: 'documents',
          types: [{ description: 'فایل پاسخ های پک پلیمر (JSON)', accept: { 'application/json': ['.json'] } }]
        });
        if (!h) return false;
        this.handle = h; this.connected = true; this.status = 'connected';
        try { await idb.set('answersHandle', h); } catch (e) { }
        const data = await this.read();
        if (data) applyAnswers(data, true);
        await this.write();
        saveNow(); render();
        toast('فایل پاسخ ها متصل شد: ' + h.name + ' — از این پس ذخیره خودکار در همین فایل است.');
        return true;
      } catch (e) {
        if (e && e.name === 'AbortError') return false;
        this.status = 'error';
        toast('اتصال فایل ناموفق بود: ' + (e && e.message ? e.message : 'خطای نامشخص'));
        return false;
      }
    },
    async restoreFromIdb() {
      if (!this.supported()) return false;
      try {
        const h = await idb.get('answersHandle');
        if (!h) return false;
        let perm = 'granted';
        try { perm = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { perm = 'prompt'; }
        if (perm !== 'granted') { this.handle = h; this.status = 'need-permission'; return false; }
        this.handle = h; this.connected = true; this.status = 'connected';
        const data = await this.read();
        if (data) applyAnswers(data, true);
        return true;
      } catch (e) { return false; }
    },
    async regrant() {
      try {
        if (!this.handle) return this.connect();
        const p = await this.handle.requestPermission({ mode: 'readwrite' });
        if (p === 'granted') { this.connected = true; this.status = 'connected'; const d = await this.read(); if (d) applyAnswers(d, true); saveNow(); render(); return true; }
      } catch (e) { }
      return this.connect();
    },
    async read() {
      if (!this.handle) return null;
      try {
        const f = await this.handle.getFile();
        const t = (await f.text()).replace(/^\uFEFF/, '').trim();
        if (!t) return null;
        const d = JSON.parse(t);
        return d && typeof d === 'object' ? (d.state && !d.checks ? d.state : d) : null;
      } catch (e) { return null; }
    },
    async write() {
      if (!this.handle || !this.connected) return false;
      try {
        this.status = 'busy';
        const w = await this.handle.createWritable();
        await w.write(JSON.stringify(this.answerPayload(), null, 2));
        await w.close();
        this.status = 'connected';
        this.lastSaved = new Date().toLocaleTimeString('fa-IR');
        const el = document.querySelector('[data-store-state]'); if (el) el.textContent = 'ذخیره شد · ' + this.lastSaved;
        return true;
      } catch (e) { this.status = 'error'; return false; }
    },
    async save() {
      if (!this.connected) return false;
      clearTimeout(this._t);
      this._t = setTimeout(() => { this.write().then(ok => { if (!ok) toast('ذخیره در فایل ناموفق بود (دسترسی فایل را بررسی کن).'); }); }, 700);
      return true;
    },
    async disconnect() {
      this.handle = null; this.connected = false; this.status = 'idle';
      await idb.del('answersHandle');
      saveNow(); render();
      toast('اتصال فایل قطع شد؛ از این پس ذخیره سازی در حافظه مرورگر است.');
    },
    async fetchSidecar() {
      if (location.protocol === 'file:') return null;   // fetch روی file:// مسدود است
      try {
        const r = await fetch(SIDECAR + '?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return null;
        const t = (await r.text()).replace(/^\uFEFF/, '').trim();
        if (!t) return null;
        const d = JSON.parse(t);
        return (d && typeof d === 'object') ? (d.state && !d.checks ? d.state : d) : null;
      } catch (e) { return null; }
    }
  };

  function answersEmpty(a) {
    if (!a) return true;
    const hasChecks = a.checks && Object.keys(a.checks).length > 0;
    const hasNotes = a.notes && Object.keys(a.notes).length > 0;
    const hasMarks = a.marks && ((a.marks.archived && Object.keys(a.marks.archived).length) || (a.marks.review && Object.keys(a.marks.review).length));
    const hasNb = (a.notebook && String(a.notebook).trim().length > 0) ||
      (Array.isArray(a.nbNotes) && a.nbNotes.some(n => n && String(n.body || '').trim().length > 0));
    return !hasChecks && !hasNotes && !hasNb && !hasMarks;
  }

  /* ---------- دفترچه چندیادداشتی: مدل داده --------------------------------
   * منبع اصلی: state.nbNotes = [{id,title,body,createdAt,updatedAt}]
   * state.nbActiveId آخرین یادداشت بازشده است تا با بازکردن دوباره دفترچه
   * دقیقاً همان یادداشت (Last Note) ادامه پیدا کند.
   * state.notebook فقط برای سازگاری با فرمت قدیمی/گزارش نگه داشته می شود.
   * --------------------------------------------------------------------- */
  function nbNormalizeNote(n) {
    if (!n || typeof n !== 'object') return null;
    const now = new Date().toISOString();
    return {
      id: n.id || uid('nb'),
      title: typeof n.title === 'string' ? n.title : '',
      body: typeof n.body === 'string' ? n.body : '',
      createdAt: n.createdAt || now,
      updatedAt: n.updatedAt || n.createdAt || now
    };
  }
  function nbTitleFromBody(body) {
    const lines = String(body || '').split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) return 'یادداشت بدون عنوان';
    const h = lines[0].replace(/^#{1,6}\s*/, '').replace(/[*_`>]/g, '').trim();
    return (h || 'یادداشت بدون عنوان').slice(0, 60);
  }
  function nbAllText() {
    const list = (state.nbNotes || []).filter(n => n && (String(n.title || '').trim() || String(n.body || '').trim()));
    if (!list.length) return state.notebook && !(state.nbNotes && state.nbNotes.length) ? state.notebook : '';
    return list.map(n => '# ' + (String(n.title || '').trim() || nbTitleFromBody(n.body)) + '\n\n' + String(n.body || '').trim()).join('\n\n---\n\n');
  }
  function nbSyncLegacy() { state.notebook = nbAllText(); }
  function nbMigrate() {
    if (!Array.isArray(state.nbNotes)) state.nbNotes = [];
    state.nbNotes = state.nbNotes.map(nbNormalizeNote).filter(Boolean);
    // مهاجرت از فرمت تک یادداشتی قدیمی
    if (!state.nbNotes.length && typeof state.notebook === 'string' && state.notebook.trim()) {
      const now = new Date().toISOString();
      state.nbNotes = [{ id: uid('nb'), title: nbTitleFromBody(state.notebook), body: state.notebook, createdAt: now, updatedAt: now }];
    }
    if (state.nbNotes.length) {
      const ok = state.nbNotes.some(n => n.id === state.nbActiveId);
      if (!ok) {
        const sorted = state.nbNotes.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        state.nbActiveId = sorted[0].id;
      }
    } else state.nbActiveId = '';
    if (state.nbMode !== 'read') state.nbMode = 'edit';
    if (state.nbView !== 'note') state.nbView = 'list';
    if (state.nbView === 'note' && !state.nbActiveId) state.nbView = 'list';
    nbSyncLegacy();
  }
  function nbActive() {
    return (state.nbNotes || []).filter(n => n.id === state.nbActiveId)[0] || null;
  }
  function nbSorted(list) {
    return (list || state.nbNotes || []).slice().sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  }

  /* اعمال «پاسخ ها» روی وضعیت فعلی (بدون دست زدن به ساختار مراحل پیش فرض) */
  function applyAnswers(a, silent) {
    if (!a) return false;
    state.checks = a.checks || {};
    state.notes = a.notes || {};
    if (a.marks) state.marks = { archived: a.marks.archived || {}, review: a.marks.review || {} };
    if (Array.isArray(a.nbNotes) && a.nbNotes.length) {
      state.nbNotes = a.nbNotes.map(nbNormalizeNote).filter(Boolean);
      state.nbActiveId = a.nbActiveId || '';
      state.nbMode = a.nbMode === 'read' ? 'read' : 'edit';
      state.nbView = a.nbView || state.nbView || 'list';
      nbMigrate();
    } else if (typeof a.notebook === 'string') { state.notebook = a.notebook; nbMigrate(); }
    if (a.customized !== undefined) state.customized = !!a.customized;
    if (a.meta && a.meta.title && !state.customized) state.meta = Object.assign(state.meta, a.meta);
    if (a.savedAt) state.savedAt = a.savedAt;
    if (!silent) render();
    return true;
  }

  /* ---------- نرمال سازی داده پیش فرض ----------------------------------- */
  function normalizePhase(p, pi) {
    const ph = {
      id: p.id || 'phase-' + pi,
      icon: p.icon || '📌',
      title: p.title || ('فاز ' + (pi + 1)),
      goal: p.goal || '',
      dod: p.dod || '',
      steps: (p.steps || []).map((s, si) => {
        const sid = s.id || ('s-' + pi + '-' + si);
        return {
          id: sid,
          title: s.title || ('مرحله ' + (si + 1)),
          meta: s.meta || '',
          tip: s.tip || '',
          stack: s.stack || '',
          subs: (s.subs || []).map((x, i) => {
            if (typeof x === 'string') return { id: sid + '-' + (i + 1), title: x };
            return { id: x.id || (sid + '-' + (i + 1)), title: x.title || '' };
          })
        };
      })
    };
    return ph;
  }

  const DEFAULT_PLAN = (function () {
    const src = (typeof PLAN_PARTS !== 'undefined' && Array.isArray(PLAN_PARTS)) ? PLAN_PARTS.flat() : [];
    return src.map(normalizePhase);
  })();

  /* ---------- وضعیت ---------------------------------------------------- */
  let state = {
    v: 1, contentVersion: CONTENT_VERSION,
    meta: { title: DEF_TITLE, sub: DEF_SUB },
    plan: clone(DEFAULT_PLAN),
    checks: {}, notes: {}, marks: { archived: {}, review: {} },
    notebook: '',      // (سازگاری قدیمی) متن تجمیعی دفترچه — منبع اصلی nbNotes است
    nbNotes: [],       // دفترچه چندیادداشتی: [{id,title,body,createdAt,updatedAt}]
    nbActiveId: '',    // آخرین یادداشت بازشده (Last Note)
    nbMode: 'edit',    // حالت دفترچه: edit | read (مثل Obsidian)
    nbView: 'list',    // نمای دفترچه: list | note
    nbQuery: '',
    savedAt: '',
    open: {},          // فازهای باز
    openNotes: {},     // پنل یادداشت های باز
    ui: { q: '', filter: 'all', stack: '', editing: false, stale: false, nbOpen: false, nbPreview: true, reportMode: 'full', sideOpen: {}, sideStepOpen: {}, sideClosed: { dev: true }, markFilters: [] }
  };

  function load() {
    const raw = store.get();
    if (!raw) return;
    try {
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return;
      if (d.meta) state.meta = Object.assign(state.meta, d.meta);
      if (Array.isArray(d.plan) && d.plan.length) state.plan = d.plan.map(normalizePhase);
      state.checks = d.checks || {};
      state.notes = d.notes || {};
      if (d.marks) state.marks = { archived: d.marks.archived || {}, review: d.marks.review || {} };
      state.open = d.open || {};
      state.openNotes = d.openNotes || {};
      state.notebook = typeof d.notebook === 'string' ? d.notebook : '';
      if (Array.isArray(d.nbNotes)) state.nbNotes = d.nbNotes.map(nbNormalizeNote).filter(Boolean);
      state.nbActiveId = d.nbActiveId || '';
      state.nbMode = d.nbMode === 'read' ? 'read' : 'edit';
      state.nbView = d.nbView || 'list';
      state.nbQuery = d.nbQuery || '';
      state.savedAt = d.savedAt || '';
      state.ui.editing = false;
      if (d.ui) {
        state.ui.nbOpen = !!d.ui.nbOpen; state.ui.nbPreview = d.ui.nbPreview !== false; state.ui.reportMode = d.ui.reportMode || 'full';
        state.ui.sideOpen = d.ui.sideOpen || {};
        state.ui.sideStepOpen = d.ui.sideStepOpen || {};
        if (Array.isArray(d.ui.markFilters)) state.ui.markFilters = d.ui.markFilters.filter(x => x === 'archived' || x === 'review');
        state.ui.sideClosed = Object.assign({ dev: true }, d.ui.sideClosed || {});
      }
      nbMigrate();
      state.ui.stale = !!(d.contentVersion && d.contentVersion !== CONTENT_VERSION);
      // اگر محتوا به روز شده و کاربر ساختار را دست کاری نکرده، خودکار به روزرسانی کن
      if (state.ui.stale && !d.customized) {
        state.plan = clone(DEFAULT_PLAN);
        state.contentVersion = CONTENT_VERSION;
        state.ui.stale = false;
      }
    } catch (e) { /* داده خراب → پیش فرض */ }
  }

  let saveTimer = null;
  function saveNow() {
    state.contentVersion = CONTENT_VERSION;
    state.savedAt = new Date().toISOString();
    try { store.set(JSON.stringify(state)); } catch (e) { }
    if (fileStore.connected) fileStore.save();   // ذخیره خودکار در answers-roadmap.json
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 280); }
  window.addEventListener('beforeunload', saveNow);

  /* ---------- شمارش ها -------------------------------------------------- */
  function stepDone(s) {
    if (!s.subs.length) return !!state.checks[s.id];
    return s.subs.every(x => !!state.checks[x.id]) && !!state.checks[s.id];
  }
  function stepPartial(s) {
    return s.subs.some(x => !!state.checks[x.id]) && !stepDone(s);
  }
  function hasNote(s) {
    return !!state.notes['n:' + s.id] || s.subs.some(x => !!state.notes['n:' + x.id]);
  }
  function counts(phase) {
    let d = 0, t = 0, notes = 0;
    (phase ? [phase] : state.plan).forEach(ph => {
      ph.steps.forEach(s => {
        t++; if (state.checks[s.id]) d++;
        if (state.notes['n:' + s.id]) notes++;
        s.subs.forEach(x => {
          t++; if (state.checks[x.id]) d++;
          if (state.notes['n:' + x.id]) notes++;
        });
      });
    });
    return { d, t, notes, p: pct(d, t) };
  }

  /* ---------- به روزرسانی سبک (بدون رندر کامل) ------------------------- */
  function refreshStep(sid, opts) {
    const f = findStep(sid); if (!f) return;
    const el = document.getElementById(sid);
    if (el) {
      const done = stepDone(f.s), part = stepPartial(f.s);
      el.classList.toggle('done', done);
      const cb = el.querySelector('.st-head input[data-ck]'); if (cb) cb.checked = done;
      const tag = el.querySelector('[data-subcount]');
      if (tag) tag.textContent = fa(f.s.subs.filter(x => state.checks[x.id]).length) + ' از ' + fa(f.s.subs.length) + ' زیرمرحله';
      const pt = el.querySelector('[data-partial]'); if (pt) pt.style.display = part ? '' : 'none';
      if (!opts || opts.subs !== false) {
        f.s.subs.forEach(x => {
          const li = document.getElementById(x.id);
          if (!li) return;
          li.classList.toggle('done', !!state.checks[x.id]);
          const c = li.querySelector('input[data-ck]');
          if (c) c.checked = !!state.checks[x.id];
        });
      }
    }
    refreshPhase(f.ph.id);
  }
  function refreshPhase(phId) {
    const ph = findPhase(phId); if (!ph) return;
    const c = counts(ph);
    $$('[data-pbar="' + phId + '"]').forEach(e => e.style.width = c.p + '%');
    $$('[data-ppct="' + phId + '"]').forEach(e => e.innerHTML = fa(c.p) + '٪ <small>پیشرفت</small>');
    $$('[data-nav="' + phId + '"]').forEach(e => e.textContent = fa(c.d) + '/' + fa(c.t));
    const b = document.querySelector('[data-phbadge="' + phId + '"]');
    if (b) {
      const done = c.t > 0 && c.d === c.t;
      b.className = 'ph-badge' + (done ? ' ok' : '');
      b.textContent = done ? 'کامل شد ✓' : fa(c.d) + '/' + fa(c.t);
    }
    const sect = document.getElementById(phId);
    if (sect) sect.classList.toggle('done', c.t > 0 && c.d === c.t);
    updateStats();
  }

  /* ---------- نشان ها: آرشیو و نیازمند بررسی ------------------------------
   * state.marks = { archived: {entityId: true}, review: {entityId: true} }
   * entityId می تواند شناسه فاز، مرحله یا زیرمرحله باشد.
   * آرشیو شده ها در نمای اصلی دیده نمی شوند؛ با فیلتر «آرشیو» برمی گردند.
   * نیازمند بررسی در صفحه اصلی می ماند و فقط با نشان مشخص می شود.
   * --------------------------------------------------------------------- */
  function isArchived(id) { return !!(state.marks && state.marks.archived && state.marks.archived[id]); }
  function needsReview(id) { return !!(state.marks && state.marks.review && state.marks.review[id]); }
  function markFiltersOn() { return Array.isArray(state.ui.markFilters) && state.ui.markFilters.length > 0; }
  function archivedFilterOn() { return Array.isArray(state.ui.markFilters) && state.ui.markFilters.indexOf('archived') !== -1; }
  function entityHasFilterMark(ph, s, x) {
    if (!markFiltersOn()) return true;
    return state.ui.markFilters.some(kind => {
      const bag = state.marks && state.marks[kind];
      if (!bag) return false;
      return !!(bag[ph.id] || (s && bag[s.id]) || (x && bag[x.id]) || (s && !x && s.subs.some(z => bag[z.id])));
    });
  }
  function stepArchivedHidden(ph, s) {
    if (state.ui.editing) return false;
    if (!isArchived(ph.id) && !isArchived(s.id)) return false;
    return !archivedFilterOn();
  }
  function subArchivedHidden(ph, s, x) {
    if (state.ui.editing) return false;
    if (!isArchived(ph.id) && !isArchived(s.id) && !isArchived(x.id)) return false;
    return !archivedFilterOn();
  }
  function subShown(ph, s, x) {
    if (state.ui.editing) return true;
    if (subArchivedHidden(ph, s, x)) return false;
    if (!markFiltersOn()) return true;
    return entityHasFilterMark(ph, s, x);
  }
  function markCount(kind) {
    const bag = (state.marks && state.marks[kind]) || {};
    let n = 0;
    state.plan.forEach(ph => {
      if (bag[ph.id]) n++;
      ph.steps.forEach(s => { if (bag[s.id]) n++; s.subs.forEach(x => { if (bag[x.id]) n++; }); });
    });
    return n;
  }
  function markBadges(id) {
    let h = '';
    if (needsReview(id)) h += '<span class="tag review-tag" title="در فهرست نیازمند بررسی است">' + I('flag') + ' نیازمند بررسی</span>';
    if (isArchived(id)) h += '<span class="tag arch-tag" title="آرشیو شده است">' + I('archive') + ' آرشیو شده</span>';
    return h;
  }
  function entityBtn(etype, eid) {
    return '<button class="iact tiny ent-btn" data-act="entity-menu" data-etype="' + etype + '" data-eid="' + esc(eid) + '" title="عملیات این مورد: آرشیو، نیازمند بررسی، اشتراک، اضافه کردن به دفترچه" aria-label="عملیات این مورد">' + I('more') + '</button>';
  }
  function findEntity(etype, eid) {
    if (etype === 'phase') { const ph = findPhase(eid); return ph ? { type: 'phase', ph: ph, label: phaseNumLabel(ph) + ' — ' + stripPhasePrefix(ph.title) } : null; }
    if (etype === 'step') { const f = findStep(eid); return f ? { type: 'step', ph: f.ph, s: f.s, label: stepNumLabel(f.ph, f.ph.steps.indexOf(f.s)) + ' — ' + stripStepPrefix(f.s.title) } : null; }
    if (etype === 'sub') {
      const f = findStepOfSub(eid);
      if (!f) return null;
      const x = f.s.subs.filter(z => z.id === eid)[0];
      return x ? { type: 'sub', ph: f.ph, s: f.s, x: x, label: subNumLabel(f.ph, f.ph.steps.indexOf(f.s), f.s.subs.indexOf(x)) + ' — ' + x.title } : null;
    }
    // تشخیص خودکار بر اساس شناسه
    return findEntity('phase', eid) || findEntity('step', eid) || findEntity('sub', eid);
  }

  /* ---------- جست وجو و فیلتر ------------------------------------------- */
  function hayOf(ph, s) {
    const si = ph.steps.indexOf(s);
    const sig = ph.id + ':' + si + ':' + state.plan.indexOf(ph);
    let h = HAY.get(s);
    if (h == null || h.phId !== sig) {
      const parts = [phaseNumLabel(ph), stripPhasePrefix(ph.title), ph.goal, stepNumLabel(ph, si), stripStepPrefix(s.title), s.meta, s.tip, s.stack || ''];
      s.subs.forEach((x, i) => { parts.push(subNumLabel(ph, si, i)); parts.push(x.title); });
      h = norm(parts.join(' \u00b6 '));
      HAY.set(s, { phId: sig, t: h });
      return h;
    }
    return h.t;
  }
  function hitObj(ph, s) {
    const q = norm(state.ui.q);
    if (!q) return true;
    return hayOf(ph, s).indexOf(q) !== -1;
  }
  function hitStack(ph, s) {
    const st = norm(state.ui.stack);
    if (!st) return true;
    return hayOf(ph, s).indexOf(st) !== -1;
  }
  function visible(s) {
    const f = state.ui.filter;
    if (f === 'todo') return !stepDone(s);
    if (f === 'done') return stepDone(s);
    if (f === 'notes') return hasNote(s);
    return true;
  }
  function matchesAll(ph, s) {
    if (stepArchivedHidden(ph, s)) return false;
    if (markFiltersOn() && !entityHasFilterMark(ph, s, null)) return false;
    return visible(s) && hitObj(ph, s) && hitStack(ph, s);
  }
  function isFiltering() { return !!state.ui.q.trim() || state.ui.filter !== 'all' || !!state.ui.stack || markFiltersOn(); }
  function stackCount(st) {
    let n = 0;
    const t = norm(st);
    state.plan.forEach(ph => ph.steps.forEach(s => { if (hayOf(ph, s).indexOf(t) !== -1) n++; }));
    return n;
  }

  /* ---------- هایلایت استک فعال + شماره گذاری خودکار ----------------------
   * وقتی فیلتر استک فعال است، خودِ کلمه استک در عنوان/نکته/زیرمرحله ها با
   * <mark class="hl-stack"> برجسته می شود تا کاربر دلیل نمایش هر مرحله را ببیند.
   * شماره فاز/مرحله/زیرمرحله «محاسباتی» است (از روی جایگاه فعلی در آرایه)؛
   * پس با افزودن، حذف یا جابه جایی، همه شماره ها خودکار اصلاح می شوند و
   * هیچ شماره ای داخل متن عنوان به صورت دستی ذخیره نمی شود.
   * --------------------------------------------------------------------- */
  function hiStack(text) {
    const raw = String(text == null ? '' : text);
    const term = String(state.ui.stack || '').trim();
    if (!term || state.ui.editing) return esc(raw);
    const low = raw.toLowerCase(), tl = term.toLowerCase();
    let out = '', i = 0, j = low.indexOf(tl);
    if (j === -1) return esc(raw);
    while (j !== -1) {
      out += esc(raw.slice(i, j)) + '<mark class="hl-stack">' + esc(raw.slice(j, j + term.length)) + '</mark>';
      i = j + term.length; j = low.indexOf(tl, i);
    }
    return out + esc(raw.slice(i));
  }
  function isAppendixPhase(ph) {
    return !!ph && (ph.id === 'ap' || /^\s*پیوست/.test(String(ph.title || '')));
  }
  function phaseOrdinal(ph) {
    let n = 0;
    for (const p of state.plan) {
      if (isAppendixPhase(p)) continue;
      n++;
      if (p.id === ph.id) return n;
    }
    return null;
  }
  function phaseNumLabel(ph) {
    if (isAppendixPhase(ph)) return 'پیوست';
    const n = phaseOrdinal(ph);
    return 'فاز ' + fa(n == null ? 0 : n);
  }
  function stripPhasePrefix(title) {
    return String(title || '').replace(/^\s*فاز\s*[۰-۹0-9]+\s*[—\-–:]\s*/, '').replace(/^\s*پیوست ها\s*[—\-–:]\s*/, '');
  }
  function stripStepPrefix(title) {
    return String(title || '').replace(/^\s*(پیوست|مرحله|گام)\s*[۰-۹0-9]+\s*[—\-–:]\s*/, '');
  }
  function stepNumLabel(ph, si) {
    if (isAppendixPhase(ph)) return fa(si + 1);
    const n = phaseOrdinal(ph);
    return fa(n == null ? 0 : n) + '.' + fa(si + 1);
  }
  function subNumLabel(ph, si, i) {
    if (isAppendixPhase(ph)) return fa(i + 1);
    const n = phaseOrdinal(ph);
    return fa(n == null ? 0 : n) + '.' + fa(si + 1) + '.' + fa(i + 1);
  }


  /* ---------- منوی عملیات هر مورد و ناوبری مطمئن -------------------------
   * برای شلوغ نشدن صفحه، هر فاز و مرحله و زیرمرحله فقط یک دکمه کوچک «...»
   * دارد و چهار عمل در یک منوی شناور باز می شود:
   * آرشیو | نیازمند بررسی | اشتراک با URL | اضافه کردن به دفترچه
   * --------------------------------------------------------------------- */
  let entCtx = null;
  let entityMenuEl = null;
  function entMenuMount() {
    if (entityMenuEl) return;
    const d = document.createElement('div');
    d.id = 'entityMenu';
    d.className = 'entity-menu';
    d.hidden = true;
    document.body.appendChild(d);
    entityMenuEl = d;
    d.addEventListener('click', (e) => {
      const b = e.target.closest('[data-entact]'); if (!b || !entCtx) return;
      const act = b.dataset.entact, ctx = entCtx;
      closeEntityMenu();
      if (act === 'archive') toggleEntityMark('archived', ctx);
      else if (act === 'review') toggleEntityMark('review', ctx);
      else if (act === 'share') shareEntity(ctx);
      else if (act === 'notebook') addEntityToNotebook(ctx);
    });
    document.addEventListener('click', (e) => {
      if (entityMenuEl && !entityMenuEl.hidden && !e.target.closest('#entityMenu') && !e.target.closest('[data-act="entity-menu"]')) closeEntityMenu();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEntityMenu(); });
    window.addEventListener('resize', closeEntityMenu);
  }
  function closeEntityMenu() { if (entityMenuEl) entityMenuEl.hidden = true; entCtx = null; }
  function openEntityMenu(btn, etype, eid) {
    entMenuMount();
    const ent = findEntity(etype, eid);
    if (!ent) { toast('این مورد پیدا نشد.'); return; }
    entCtx = { type: etype, id: eid };
    const arch = isArchived(eid), rev = needsReview(eid);
    entityMenuEl.innerHTML =
      '<div class="em-head"><b>' + esc(ent.label) + '</b><span>' + (etype === 'phase' ? 'فاز' : (etype === 'step' ? 'مرحله' : 'زیرمرحله')) + '</span></div>' +
      '<button data-entact="archive">' + I('archive') + (arch ? ' خروج از آرشیو' : ' آرشیو') + (arch ? '<b>فعال است</b>' : '') + '</button>' +
      '<button data-entact="review">' + I('flag') + (rev ? ' حذف از نیازمند بررسی' : ' نیازمند بررسی') + (rev ? '<b>فعال است</b>' : '') + '</button>' +
      '<button data-entact="share">' + I('share') + ' اشتراک با URL</button>' +
      '<button data-entact="notebook">' + I('note') + ' اضافه کردن به دفترچه</button>';
    entityMenuEl.hidden = false;
    const r = btn.getBoundingClientRect();
    const w = 264;
    let left = r.right - w;
    if (left < 8) left = 8;
    if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
    let top = r.bottom + 6;
    if (top + 250 > window.innerHeight) top = Math.max(8, r.top - 256);
    entityMenuEl.style.left = left + 'px';
    entityMenuEl.style.top = top + 'px';
  }
  function toggleEntityMark(kind, ctx) {
    if (!state.marks) state.marks = { archived: {}, review: {} };
    if (!state.marks[kind]) state.marks[kind] = {};
    const on = !!state.marks[kind][ctx.id];
    if (on) delete state.marks[kind][ctx.id]; else state.marks[kind][ctx.id] = true;
    saveNow(); render();
    if (kind === 'archived') toast(on ? 'از آرشیو خارج شد و در صفحه اصلی دیده می شود.' : 'آرشیو شد؛ با فیلتر «آرشیو» در هدر یا سایدبار دوباره دیده می شود.');
    else toast(on ? 'از فهرست نیازمند بررسی حذف شد.' : 'به فهرست نیازمند بررسی اضافه شد.');
  }
  function entityShareUrl(ctx) {
    const base = String(location.href || '').split('#')[0];
    return base + '#item=' + encodeURIComponent(ctx.type + ':' + ctx.id);
  }
  function shareEntity(ctx) {
    const ent = findEntity(ctx.type, ctx.id); if (!ent) return;
    const url = entityShareUrl(ctx);
    try { history.replaceState(null, '', '#item=' + encodeURIComponent(ctx.type + ':' + ctx.id)); } catch (e) { }
    const title = ent.label;
    const done = () => toast('لینک اشتراک کپی شد: ' + url);
    const copyIt = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done));
      else fallbackCopy(url, done);
    };
    try {
      if (navigator.share) {
        navigator.share({ title: title, text: title, url: url }).then(() => toast('اشتراک گذاری انجام شد.'), (e) => { if (!e || e.name !== 'AbortError') copyIt(); });
        return;
      }
    } catch (e) { }
    copyIt();
